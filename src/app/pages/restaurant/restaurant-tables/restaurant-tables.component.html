<div class="min-h-screen bg-gray-50 p-6">
  <div class="max-w-7xl mx-auto">
    <div class="flex justify-between items-center mb-8">
      <h1 class="text-3xl font-bold text-gray-900">Gestion des Tables</h1>
      <button
        (click)="openRegisterModal()"
        class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-medium transition"
      >
        Enregistrer une Table
      </button>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
      <div *ngFor="let table of tables" class="bg-white rounded-lg shadow-md p-6">
        <h3 class="text-xl font-semibold text-gray-800 mb-4">{{ table.name }}</h3>

        <div class="flex justify-center mb-4">
          <img *ngIf="table.qrCode" [src]="table.qrCode" alt="QR Code" class="w-32 h-32" />
        </div>

        <div class="text-center">
          <button
            (click)="downloadQR(table)"
            class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded-lg font-medium transition"
          >
            Télécharger QR
          </button>
        </div>
      </div>
    </div>

    <!-- Modal Enregistrer Table -->
    <div *ngIf="showRegisterModal" class="fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50">
      <div class="bg-white rounded-lg shadow-lg w-full max-w-md p-6">
        <h2 class="text-2xl font-bold mb-4">Enregistrer une Table</h2>

        <form (submit)="registerTable(); $event.preventDefault()">
          <div class="mb-4">
            <label for="tableName" class="block text-sm font-medium text-gray-700 mb-2">
              Nom de la Table
            </label>
            <input
              id="tableName"
              type="text"
              [(ngModel)]="newTableName"
              name="tableName"
              required
              class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Ex: Table 1"
            />
          </div>

          <div class="flex justify-end space-x-3">
            <button
              type="button"
              (click)="closeRegisterModal()"
              class="px-4 py-2 bg-gray-300 hover:bg-gray-400 text-gray-800 rounded-md transition"
            >
              Annuler
            </button>
            <button
              type="submit"
              class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md transition"
            >
              Enregistrer
            </button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
