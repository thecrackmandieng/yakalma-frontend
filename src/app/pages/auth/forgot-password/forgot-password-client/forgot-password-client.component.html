
<app-header-p></app-header-p>

<div class="mt-8 mb-8 bg-white px-4 flex flex-col items-center justify-center text-center font-serif">

  <!-- Titre principal -->
  <h1 class="text-4xl md:text-6xl font-extrabold mb-4">Mot de passe oublié</h1>

  <!-- Description -->
  <p class="text-gray-600 max-w-lg mb-8 text-sm md:text-base">
    Entrez votre adresse email pour recevoir un lien de réinitialisation de votre mot de passe
  </p>

  <!-- Carte principale -->
  <div class="bg-white shadow-2xl rounded-2xl px-6 py-8 w-full max-w-md">

    <!-- Titre formulaire -->
    <h2 class="text-2xl sm:text-3xl font-bold mb-6">Réinitialiser le mot de passe</h2>

    <form (ngSubmit)="onResetPassword()" #resetForm="ngForm" class="space-y-5">
      <!-- Email -->
      <div class="text-left">
         <label for="email" class="block text-left font-semibold text-gray-700 mb-2">Adresse email</label>
         <input
         type="email"
         id="email"
         name="email"
         placeholder="Entrez votre adresse email"
         class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-[#5371ff] placeholder-gray-400"
         [(ngModel)]="email"
         required
         (input)="validateEmail()"
         />
      </div>


      <!-- Bouton -->
      <button
        type="submit"
        [disabled]="!isFormValid() || isLoading"
        class="w-full mb-2 py-3 bg-[#5371ff] text-white font-semibold rounded-lg hover:bg-[#415ad8] disabled:bg-gray-400 disabled:cursor-not-allowed transition flex items-center justify-center"
      >
        <ng-container *ngIf="!isLoading; else loadingTpl">
          Envoyer le lien de réinitialisation
        </ng-container>
        <ng-template #loadingTpl>
          <svg
            class="animate-spin h-5 w-5 text-white"
            xmlns="http://www.w3.org/2000/svg"
            fill="none"
            viewBox="0 0 24 24"
          >
            <circle
              class="opacity-25"
              cx="12"
              cy="12"
              r="10"
              stroke="currentColor"
              stroke-width="4"
            ></circle>
            <path
              class="opacity-75"
              fill="currentColor"
              d="M4 12a8 8 0 018-8v8z"
            ></path>
          </svg>
        </ng-template>
      </button>

      <!-- Lien retour -->
      <div class="text-center mt-4">
        <a
          href="/login"
          class="text-[#5371ff] text-sm !no-underline hover:underline font-medium"
        >
          ← Retour à la connexion
        </a>
      </div>
    </form>

    <!-- Message d'erreur -->
    <div *ngIf="errorMessage" class="mt-4 text-red-700 bg-red-100 border border-red-300 rounded-md p-3 text-sm">
      {{ errorMessage }}
    </div>

    <!-- Message de succès -->
    <div *ngIf="successMessage" class="mt-4 text-green-700 bg-green-100 border border-green-300 rounded-md p-3 text-sm">
      {{ successMessage }}
    </div>
  </div>

  <!-- Footer -->
  <div class="mt-8 w-full max-w-md text-gray-600 text-sm flex justify-between items-center px-4">
    <div class="flex space-x-4">
      <!-- Tu peux rajouter des liens si besoin -->
    </div>
  </div>
</div>

<app-footer></app-footer>
